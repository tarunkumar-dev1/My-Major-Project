<!--
    index.html
    Login page for the SkillGap AI Skill Gap Analyzer frontend.
    Purpose: Collect user credentials and redirect to the dashboard on success.
    Notes: Form is handled by `js/main.js` which performs client-side validation
    and calls the backend API at `/api/auth/login`.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Skill Gap Analyzer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-illustration">
                <i class="ph ph-brain" style="font-size: 120px; color: white; margin-bottom: 2rem;"></i>
                <h2>Accelerate Your Career</h2>
                <p>Let AI analyze your skills, build your custom roadmap, and bridge the gap to your dream job.</p>
            </div>
            <div class="auth-form-container">
                <div class="auth-header">
                    <h1>Welcome Back</h1>
                    <p>Enter your details to access your dashboard.</p>
                </div>
                <!-- Login Form -->
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="Enter your Gmail address" required pattern="^[A-Za-z0-9._%+-]+@gmail\\.com$">
                        <div style="margin-top: 0.35rem; font-size: 0.85rem; color: var(--text-secondary);">Only valid Gmail accounts are allowed.</div>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </form>
                <div class="auth-footer">
                    Don't have an account? <a href="signup.html">Create Account</a>
                </div>
            </div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/main.js?v=20260426"></script>
</body>

</html>
