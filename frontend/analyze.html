<!--
    analyze.html
    Student skill submission UI where users list current skills and select a
    career goal. Submissions are sent to `/api/student/submit-skills` and the
    backend returns an analysis and a generated roadmap.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyze Skills - AI Skill Gap Analyzer</title>
    <base href="/">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="ph-fill ph-brain" style="font-size: 28px;"></i>
                <span>SkillGap AI</span>
            </div>
            <nav class="sidebar-nav" style="display: flex; flex-direction: column; height: 100%;">
                <div style="flex: 1;">
                    <a href="dashboard.html" class="nav-link">
                        <i class="ph ph-squares-four"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="analyze.html" class="nav-link active">
                        <i class="ph ph-target"></i>
                        <span>Analyze Skills</span>
                    </a>
                    <a href="progress.html" class="nav-link">
                        <i class="ph ph-chart-line-up"></i>
                        <span>Progress</span>
                    </a>
                    <a href="profile.html" class="nav-link">
                        <i class="ph ph-user"></i>
                        <span>Profile</span>
                    </a>
                    <a href="admin-login.html" class="nav-link">
                        <i class="ph ph-shield-check"></i>
                        <span>Admin</span>
                    </a>
                </div>
                <div style="margin-top: auto;">
                    <button class="nav-link" id="theme-toggle"
                        style="width: 100%; border: none; background: transparent; cursor: pointer; text-align: left;">
                        <i class="ph ph-moon"></i>
                        <span>Dark Mode</span>
                    </button>
                    <a href="index.html" class="nav-link" style="color: #EF4444; margin-top: 0.5rem;">
                        <i class="ph ph-sign-out"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-search">
                    <i class="ph ph-magnifying-glass" style="color: var(--text-muted);"></i>
                    <input type="text" placeholder="Search courses, skills...">
                </div>
                <div class="user-profile">
                    <button class="btn btn-icon"
                        style="background: transparent; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer; position: relative;">
                        <i class="ph ph-bell"></i>
                    </button>
                    <div class="avatar">JD</div>
                    <div class="user-info" style="display: flex; flex-direction: column;">
                        <span style="font-weight: 600; font-size: 0.9rem;">John Doe</span>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">Free Plan</span>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="dashboard-header">
                    <div class="welcome-msg">
                        <h1>Analyze Your Skills 🎯</h1>
                        <p style="color: var(--text-secondary);">Input your skills and target role to let our AI
                            generate a personalized roadmap.</p>
                    </div>
                </div>

                <div class="dashboard-card" style="max-width: 800px; margin: 0 auto;">
                    <form id="analyzeForm">
                        <div class="form-group" style="margin-bottom: 2rem;">
                            <label style="font-size: 1.1rem; margin-bottom: 0.75rem;">Step 1: Select Target Career
                                Goal</label>
                            <select id="targetCareer" class="form-control"
                                style="padding: 1rem; appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748B%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 1rem top 50%; background-size: .65em auto; cursor: pointer;">
                                <option value="">Loading careers...</option>
                            </select>
                        </div>

                        <div class="form-group" style="margin-bottom: 2.5rem;">
                            <label style="font-size: 1.1rem; margin-bottom: 0.75rem;">Step 2: Add Your Current
                                Skills</label>
                            <div class="skill-input-container" id="skillTagsContainer">
                                <!-- Tags will be injected here via JS -->
                                <input type="text" id="skillInput" placeholder="Type a skill and press Enter...">
                            </div>
                            <div style="margin-top: 1rem; font-size: 0.875rem; color: var(--text-secondary);">
                                <strong id="suggestedTitle">Suggested Skills:</strong>
                                <div id="languageHintsText" style="margin-top: 0.5rem;"></div>
                                <div id="suggestedSkillsContainer" class="tags-container"
                                    style="margin-top: 0.5rem; opacity: 0.8;"></div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary"
                            style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                            <i class="ph ph-magic-wand"></i> Analyze & Generate AI Roadmap
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_BASE = window.SKILLGAP_CONFIG?.API_BASE_URL || 'https://backendaiskillgap.tarunkumar17.me/api';
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'index.html';
                return;
            }

            const languageHintsByCareer = {
                "Machine Learning Engineer": ["Python", "SQL"],
                "Data Scientist": ["Python", "R", "SQL"],
                "Frontend Developer": ["JavaScript", "TypeScript", "HTML", "CSS"],
                "Backend Developer": ["Python", "Node.js", "Java", "SQL"],
                "Full Stack Developer": ["JavaScript", "TypeScript", "Python", "SQL"],
                "DevOps Engineer": ["Bash", "Python"],
                "Cloud Architect": ["Python", "Bash"],
                "Cybersecurity Analyst": ["Python", "Bash"]
            };

            const commonLanguages = new Set([
                "Python", "JavaScript", "TypeScript", "Java", "C", "C++", "C#", "Go", "Rust", "R",
                "PHP", "Ruby", "Swift", "Kotlin", "SQL", "Bash", "PowerShell", "Scala", "Perl"
            ]);

            const targetCareerSelect = document.getElementById('targetCareer');
            const suggestedTitle = document.getElementById('suggestedTitle');
            const languageHintsText = document.getElementById('languageHintsText');
            const suggestedSkillsContainer = document.getElementById('suggestedSkillsContainer');

            // User Info Population
            Promise.all([
                fetch(`${API_BASE}/student/dashboard`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                }),
                fetch(`${API_BASE}/student/careers`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
            ])
                .then(async ([dashboardRes, careersRes]) => {
                    const dashboardData = dashboardRes.ok ? await dashboardRes.json() : null;
                    const careersData = careersRes.ok ? await careersRes.json() : null;

                    if (dashboardData && dashboardData.user) {
                        const initials = dashboardData.user.name.substring(0, 2).toUpperCase();
                        document.querySelector('.avatar').textContent = initials;
                        document.querySelector('.user-info span:first-child').textContent = dashboardData.user.name;
                    }

                    const careers = (careersData && careersData.careers) ? careersData.careers : [];
                    populateCareerDropdown(careers);
                })
                .catch(console.error);

            // Tagging Logic
            const skillInput = document.getElementById('skillInput');
            const tagsContainer = document.getElementById('skillTagsContainer');
            const analyzeForm = document.getElementById('analyzeForm');
            let skills = [];
            let careersMap = {};

            function populateCareerDropdown(careers) {
                if (!targetCareerSelect) return;

                targetCareerSelect.innerHTML = '';
                careersMap = {};

                if (!careers || careers.length === 0) {
                    const placeholder = document.createElement('option');
                    placeholder.value = '';
                    placeholder.textContent = 'No careers available';
                    placeholder.disabled = true;
                    targetCareerSelect.appendChild(placeholder);
                    return;
                }

                const placeholder = document.createElement('option');
                placeholder.value = '';
                placeholder.textContent = 'Select a career goal';
                placeholder.disabled = true;
                placeholder.selected = true;
                targetCareerSelect.appendChild(placeholder);

                careers.forEach((career) => {
                    const careerName = career.career_name || career.name || '';
                    if (!careerName) return;
                    careersMap[careerName] = career;

                    const option = document.createElement('option');
                    option.value = careerName;
                    option.textContent = careerName;
                    targetCareerSelect.appendChild(option);
                });

                targetCareerSelect.addEventListener('change', updateSuggestedSkills);
                updateSuggestedSkills();
            }

            function addSkill(skill) {
                const normalized = (skill || '').trim();
                if (!normalized || skills.includes(normalized)) {
                    return;
                }
                skills.push(normalized);
                renderTags();
            }

            function updateSuggestedSkills() {
                const selectedCareer = targetCareerSelect ? targetCareerSelect.value : '';
                const careerHints = languageHintsByCareer[selectedCareer] || [];
                const careerConfig = careersMap[selectedCareer] || {};
                const requiredSkills = careerConfig.required_skills || [];

                if (languageHintsText) {
                    languageHintsText.textContent = careerHints.length
                        ? `Start with: ${careerHints.join(', ')}`
                        : 'Enter skills relevant to your selected career.';
                }

                if (suggestedSkillsContainer) {
                    suggestedSkillsContainer.innerHTML = '';
                    const skillSuggestions = requiredSkills.length
                        ? requiredSkills.slice(0, 6)
                        : Array.from(commonLanguages).slice(0, 6);

                    skillSuggestions.forEach((skill) => {
                        const badge = document.createElement('span');
                        badge.className = 'tag';
                        badge.textContent = skill;
                        badge.style.cursor = 'pointer';
                        badge.addEventListener('click', () => addSkill(skill));
                        suggestedSkillsContainer.appendChild(badge);
                    });
                }
            }

            function renderTags() {
                if (!tagsContainer) return;

                const existingTags = tagsContainer.querySelectorAll('.tag');
                existingTags.forEach((t) => t.remove());

                skills.forEach((skill, index) => {
                    const tag = document.createElement('span');
                    tag.className = 'tag';
                    tag.innerHTML = `${skill} <button type="button" data-index="${index}"><i class="ph ph-x"></i></button>`;
                    tagsContainer.insertBefore(tag, skillInput);
                });

                tagsContainer.querySelectorAll('button[data-index]').forEach((btn) => {
                    btn.addEventListener('click', (e) => {
                        const idx = parseInt(e.currentTarget.getAttribute('data-index'), 10);
                        skills.splice(idx, 1);
                        renderTags();
                    });
                });
            }

            if (skillInput) {
                skillInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addSkill(skillInput.value);
                        skillInput.value = '';
                    }
                });
            }

            if (analyzeForm) {
                analyzeForm.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const career_goal = targetCareerSelect ? targetCareerSelect.value : '';
                    if (!career_goal) {
                        alert('Please select a target career goal.');
                        return;
                    }

                    if (!skills.length) {
                        alert('Please add at least one skill before analyzing.');
                        return;
                    }

                    const submitButton = analyzeForm.querySelector('button[type="submit"]');
                    const originalText = submitButton ? submitButton.textContent : 'Submitting...';
                    if (submitButton) {
                        submitButton.textContent = 'Analyzing...';
                        submitButton.disabled = true;
                    }

                    try {
                        const response = await fetch(`${API_BASE}/student/submit-skills`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                Authorization: `Bearer ${token}`,
                            },
                            body: JSON.stringify({ skills, career_goal }),
                        });

                        const result = await response.json();
                        if (!response.ok) {
                            throw new Error(result.error || 'Failed to analyze skills');
                        }

                        alert('Roadmap generation complete! Redirecting to your dashboard...');
                        window.location.href = 'dashboard.html';
                    } catch (err) {
                        console.error(err);
                        alert(err.message || 'There was a problem submitting your skills.');
                    } finally {
                        if (submitButton) {
                            submitButton.textContent = originalText;
                            submitButton.disabled = false;
                        }
                    }
                });
            }

            // Initialize selection state
            updateSuggestedSkills();
        });
    </script>
</body>

</html>
